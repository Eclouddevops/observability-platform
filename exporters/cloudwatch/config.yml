# CloudWatch Exporter Configuration
# Region: ap-south-1 (Mumbai) — covers UAT and DEV Terraform environments
# Account: 496251222247
region: ap-south-1

metrics:

  # ── EC2 — all instances (UAT + DEV ASG instances) ──────────────────
  - aws_namespace: AWS/EC2
    aws_metric_name: CPUUtilization
    aws_dimensions: [InstanceId]
    aws_statistics: [Average, Maximum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: NetworkIn
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: NetworkOut
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: StatusCheckFailed
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/EC2
    aws_metric_name: StatusCheckFailed_Instance
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/EC2
    aws_metric_name: StatusCheckFailed_System
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/EC2
    aws_metric_name: EBSReadBytes
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  - aws_namespace: AWS/EC2
    aws_metric_name: EBSWriteBytes
    aws_dimensions: [InstanceId]
    aws_statistics: [Sum]
    period_seconds: 300

  # ── Auto Scaling Groups — UAT + DEV ──────────────────────────────────
  - aws_namespace: AWS/AutoScaling
    aws_metric_name: GroupInServiceInstances
    aws_dimensions: [AutoScalingGroupName]
    aws_statistics: [Average]
    period_seconds: 60

  - aws_namespace: AWS/AutoScaling
    aws_metric_name: GroupDesiredCapacity
    aws_dimensions: [AutoScalingGroupName]
    aws_statistics: [Average]
    period_seconds: 60

  - aws_namespace: AWS/AutoScaling
    aws_metric_name: GroupPendingInstances
    aws_dimensions: [AutoScalingGroupName]
    aws_statistics: [Average]
    period_seconds: 60

  - aws_namespace: AWS/AutoScaling
    aws_metric_name: GroupTerminatingInstances
    aws_dimensions: [AutoScalingGroupName]
    aws_statistics: [Average]
    period_seconds: 60

  # ── ALB — observability-uat-alb + observability-dev-alb ─────────────
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: RequestCount
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_Target_2XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_Target_4XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_Target_5XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: TargetResponseTime
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Average, p99]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HealthyHostCount
    aws_dimensions: [LoadBalancer, TargetGroup]
    aws_statistics: [Average]
    period_seconds: 60

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: UnHealthyHostCount
    aws_dimensions: [LoadBalancer, TargetGroup]
