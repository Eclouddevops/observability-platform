# DEV ALB Targets — ap-south-1
# ─────────────────────────────────────────────────────────────────
# This file is automatically updated by terraform/deploy.sh after
# every terraform apply for the DEV environment.
#
# To update manually after terraform apply:
#   cd terraform/environments/dev
#   ALB=$(terraform output -raw alb_dns_name)
#   sed -i "s|REPLACE_WITH_DEV_ALB|$ALB|g" \
#     ../../prometheus/targets/dev_alb_targets.yml
#
# ─────────────────────────────────────────────────────────────────
- targets:
    - "REPLACE_WITH_DEV_ALB"    # e.g. observability-dev-alb-xxx.ap-south-1.elb.amazonaws.com
  labels:
    environment: "dev"
    region:      "ap-south-1"
    tier:        "alb"
    project:     "observability"
