# ══════════════════════════════════════════════════════════════════════
# Website & API Endpoint Monitoring
# Probed by Blackbox Exporter every 60s (HTTP 200 check)
# Add your URLs below — Prometheus auto-reloads this file every 30s
# ══════════════════════════════════════════════════════════════════════

# ── Main Website ───────────────────────────────────────────────────────
- targets:
    - 'https://aiobz.com'
    - 'https://www.aiobz.com'
  labels:
    env: production
    service: website
    category: main
    owner: eclouddevops

# ── UAT Website (EC2) ──────────────────────────────────────────────────
# Replace the placeholder below with your actual UAT EC2 URL or IP
- targets:
    - 'http://uat.aiobz.com'          # UAT subdomain — replace with actual URL
    # - 'http://<uat-ec2-public-ip>'  # Alternatively, use EC2 public IP + port
  labels:
    env: uat
    service: website
    category: main
    owner: eclouddevops

# ── Dev Website (EC2) ──────────────────────────────────────────────────
# Replace the placeholder below with your actual Dev EC2 URL or IP
- targets:
    - 'http://dev.aiobz.com'          # Dev subdomain — replace with actual URL
    # - 'http://<dev-ec2-public-ip>'  # Alternatively, use EC2 public IP + port
  labels:
    env: dev
    service: website
    category: main
    owner: eclouddevops

