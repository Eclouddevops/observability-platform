# ══════════════════════════════════════════════════════════════════════
# Website & API Endpoint Monitoring
# Probed by Blackbox Exporter every 60s (HTTP 200 check)
# Add your URLs below — Prometheus auto-reloads this file every 30s
# ══════════════════════════════════════════════════════════════════════

# ── Main Website ───────────────────────────────────────────────────────
- targets:
    - 'https://aiobz.com'
    - 'https://www.aiobz.com'
  labels:
    env: production
    service: website
    category: main
    owner: eclouddevops

# ── UAT Website (EC2 — Apache HTTP) ───────────────────────────────────
# After running:  bash scripts/setup-apache-env.sh <uat-ip> uat [key|ssm]
# Replace <uat-ec2-public-ip> with the actual IP printed by that script.
- targets:
    - 'http://<uat-ec2-public-ip>/health.html'  # ← replace with UAT EC2 IP
  labels:
    env: uat
    service: website
    category: main
    owner: eclouddevops

# ── Dev Website (EC2 — Apache HTTP) ───────────────────────────────────
# After running:  bash scripts/setup-apache-env.sh <dev-ip> dev [key|ssm]
# Replace <dev-ec2-public-ip> with the actual IP printed by that script.
- targets:
    - 'http://<dev-ec2-public-ip>/health.html'  # ← replace with Dev EC2 IP
  labels:
    env: dev
    service: website
    category: main
    owner: eclouddevops

