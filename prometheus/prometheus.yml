global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'observability-platform'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # ── Prometheus self ──────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Node Exporter container ───────────────────────────────────────
  # Reads /textfiles/ec2_metrics.prom via textfile_collector
  # ec2_metrics.prom contains ALL UAT + DEV EC2 metrics auto-discovered
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'observability-server'

  # ── cAdvisor ─────────────────────────────────────────────────────
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── CloudWatch Exporter — ap-south-1 (UAT + DEV) ─────────────────
  # Produces aws_ec2_* ALB, RDS, ASG metrics from Mumbai region
  - job_name: 'cloudwatch'
    scrape_interval: 60s
    scrape_timeout: 55s
    honor_labels: true
    static_configs:
      - targets: ['cloudwatch-exporter:9106']

  # ── Blackbox HTTP probing — general websites ──────────────────────
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/websites.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Blackbox HTTP — UAT ALB health check ─────────────────────────
  # File is auto-updated by the deploy.sh script after terraform apply
  - job_name: 'blackbox-uat-alb'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/uat_alb_targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - target_label: environment
        replacement: uat
      - target_label: region
        replacement: ap-south-1

  # ── Blackbox HTTP — DEV ALB health check ─────────────────────────
  - job_name: 'blackbox-dev-alb'
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/dev_alb_targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - target_label: environment
        replacement: dev
      - target_label: region
        replacement: ap-south-1

  # ── SSL Certificate Expiry ────────────────────────────────────────
  - job_name: 'ssl-certificates'
    metrics_path: /probe
    params:
      module: [tcp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/ssl_targets.yml
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ssl-exporter:9219

  # ── Windows Exporter ──────────────────────────────────────────────
  - job_name: 'windows-exporter'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/windows_nodes.yml
        refresh_interval: 30s

  # ── Blackbox ICMP Ping ────────────────────────────────────────────
  - job_name: 'blackbox-ping'
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/ping_targets.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ── Grafana ───────────────────────────────────────────────────────
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # ── AI Agent ─────────────────────────────────────────────────────
  - job_name: 'ai-agent'
    static_configs:
      - targets: ['ai-observability-agent:8888']

  # ── Auto-Discovery Agent ─────────────────────────────────────────
  # Writes ec2_metrics.prom every 2 min covering ap-south-1
  # UAT instances: env="uat"  |  DEV instances: env="dev"
  # All tagged ManagedBy=terraform are automatically included
  - job_name: 'auto-discovery'
    static_configs:
      - targets: ['ec2-auto-discovery:9877']
